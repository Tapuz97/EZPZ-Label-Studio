[package]
name = "ezpz-label-studio"
version = "0.6.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "Offline Windows Bluetooth label editor"
edition = "2021"

[lib]
name = "ble_label_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
btleplug = "0.11"
uuid = "1"
futures-util = "0.3"
rfd = "0.15"
flate2 = "1"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
